<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cache-busting meta tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>XRPchat.app</title>
    <!-- CSP is managed by Netlify headers; page-level CSP removed to avoid conflicts -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/img/favicons/qr-logo-favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicons/qr-logo-favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicons/qr-logo-favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icon-192x192.png">
    <style>
      /* Prevent white page flash during loading */
      html, body {
        background-color: #f3f4f6; /* gray-100 */
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #111827; /* gray-900 */
          color: #f9fafb;
        }
      }
      
      /* Loading skeleton styles */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: #f3f4f6;
        display: flex;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      
      @media (prefers-color-scheme: dark) {
        #app-loading {
          background: #111827;
        }
      }
      
      /* Loading skeleton - sidebar */
      #app-loading .skeleton-sidebar {
        width: 384px;
        height: 100vh;
        background: white;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
      }
      
      @media (prefers-color-scheme: dark) {
        #app-loading .skeleton-sidebar {
          background: #1f2937;
        }
      }
      
      /* Loading skeleton - header */
      #app-loading .skeleton-header {
        height: 88px;
        background: #10b981;
        padding: 22px 16px;
      }
      
      /* Loading skeleton - content */
      #app-loading .skeleton-content {
        flex: 1;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      @media (prefers-color-scheme: dark) {
        #app-loading .skeleton-content {
          background: #111827;
        }
      }
      
      /* Loading spinner */
      #app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top: 4px solid #10b981;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @media (prefers-color-scheme: dark) {
        #app-loading .spinner {
          border-color: #374151;
          border-top-color: #10b981;
        }
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loading screen once app loads */
      body.app-loaded #app-loading {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading skeleton shown until React loads -->
    <div id="app-loading">
      <div class="skeleton-sidebar">
        <div class="skeleton-header"></div>
      </div>
      <div class="skeleton-content">
        <div class="spinner"></div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(error => {
              console.error('ServiceWorker registration failed: ', error);
            });
        });
      }
    </script>
  </body>
</html>
